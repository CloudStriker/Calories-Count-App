name: calsnap
description: Photo-based food calorie tracker with Gemini vision and Android Health Connect sync for Samsung Health.
publish_to: 'none'
version: 0.3.0+4

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.1.1
  health: ^14.0.0
  http: ^1.3.0
  image_picker: ^1.1.2
  material_ui: ^1.11.1
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.2
  sqflite: ^2.4.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
